<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>DANI WAY FILTER</title>
<meta name="theme-color" content="#FBF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DANI WAY FILTER">
<meta name="description" content="다니웨이 블로그 사진 보정 — 네 가지 필름 프리셋, 질감, 상세 조절">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FAF7F2'/%3E%3Crect x='6' y='6' width='52' height='52' fill='none' stroke='%232C2825' stroke-width='1.6'/%3E%3Ctext x='32' y='38' font-family='Georgia,serif' font-size='15' letter-spacing='1' text-anchor='middle' fill='%232C2825'%3EFILTER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --paper:#FBF9F6;
  --paper-2:#F6F2EB;
  --wash:#F1ECE3;
  --card:#FFFFFF;
  --line:#E6DFD4;
  --line-soft:#EFE9DF;
  --ink:#2C2621;
  --ink-2:#4C443B;
  --muted:#8A7F72;
  --faint:#ADA294;
  --sand:#CBBFA9;
  --serif:"Cormorant Garamond","Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
::selection{background:#EDE4D3;color:var(--ink)}

.app{
  position:relative;
  width:100%;max-width:480px;margin:0 auto;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--paper);
  overflow:hidden;
}

/* ---------------- header ---------------- */
.top{
  flex:0 0 auto;
  display:grid;grid-template-columns:44px 1fr 56px;align-items:center;
  padding:calc(4px + env(safe-area-inset-top)) 12px 4px;
  min-height:52px;
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-2);
  transition:background .18s var(--ease), color .18s var(--ease);
}
.icon-btn:active{background:var(--paper-2)}
.icon-btn svg{width:19px;height:19px;display:block}
.brand{text-align:center;line-height:1;user-select:none}
.brand-en{
  display:block;font-family:var(--serif);font-size:13.5px;font-weight:600;
  letter-spacing:.30em;text-indent:.30em;color:var(--ink);
}
.brand-sub{
  display:block;margin-top:4px;
  font-family:var(--sans);font-size:8px;font-weight:500;
  letter-spacing:.42em;text-indent:.42em;color:var(--muted);
}
.save-btn{
  justify-self:end;
  font-size:10.5px;font-weight:600;letter-spacing:.16em;text-indent:.16em;
  padding:8px 11px;border:1px solid var(--ink);border-radius:1px;
  color:var(--ink);background:transparent;
  transition:opacity .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
  white-space:nowrap;
}
.save-btn:active{background:var(--ink);color:var(--paper)}
.save-btn[disabled]{opacity:.28;border-color:var(--faint);color:var(--muted);pointer-events:none}

/* ---------------- stage ---------------- */
.stage-wrap{
  flex:1 1 auto;min-height:0;
  padding:4px 12px 0;display:flex;
}
.stage{
  position:relative;flex:1 1 auto;min-height:0;
  background:var(--wash);
  border:1px solid var(--line-soft);
  overflow:hidden;
  display:grid;place-items:center;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}

/* empty state */
.empty{
  position:absolute;inset:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  text-align:center;padding:18px;
}
.empty::before{
  content:"";position:absolute;inset:0;
  border:1px solid rgba(203,191,169,.55);
  pointer-events:none;
}
.empty-corners{position:absolute;inset:0;pointer-events:none}
.empty-corners i{position:absolute;width:9px;height:9px;border:0 solid var(--sand)}
.empty-corners i:nth-child(1){top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.empty-corners i:nth-child(2){top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.empty-corners i:nth-child(3){bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.empty-corners i:nth-child(4){bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.empty-mark{font-family:var(--serif);font-size:19px;letter-spacing:.26em;text-indent:.26em;color:var(--ink-2);line-height:1.15}
.empty-mark span{display:block;margin-top:5px;font-size:8.5px;font-family:var(--sans);letter-spacing:.44em;text-indent:.44em;color:var(--muted)}
.empty-rule{width:26px;height:1px;background:var(--sand);margin:16px 0 15px}
.empty-title{font-family:var(--serif);font-size:16px;color:var(--ink-2);margin:0 0 5px;letter-spacing:.02em}
.empty-sub{font-size:11px;color:var(--muted);margin:0 0 18px;letter-spacing:.01em;line-height:1.6}
.empty-btn{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-indent:.14em;
  padding:10px 20px;border:1px solid var(--ink);border-radius:1px;color:var(--ink);
  transition:background .18s var(--ease),color .18s var(--ease);
}
.empty-btn:active{background:var(--ink);color:var(--paper)}
.empty-hint{margin:18px 0 0;font-size:9.5px;color:var(--faint);letter-spacing:.02em}

/* photo frames */
.frames{
  position:absolute;inset:0;
  display:grid;place-items:center;
  touch-action:manipulation;
}
.frames canvas{
  grid-area:1/1;
  display:block;
  background:var(--wash);
  box-shadow:0 12px 34px -22px rgba(44,38,33,.55);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#canvasBefore{opacity:0;transition:opacity .14s linear}
.frames.cmp #canvasBefore{opacity:1}

.badge{
  position:absolute;left:22px;top:22px;
  display:flex;align-items:center;gap:5px;
  padding:4px 8px;background:rgba(251,249,246,.9);
  border:1px solid rgba(230,223,212,.9);
  font-size:8.5px;letter-spacing:.2em;text-indent:.2em;color:var(--ink-2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:1;transition:opacity .16s var(--ease);
  pointer-events:none;white-space:nowrap;
}
.badge.before{color:#fff;background:rgba(44,38,33,.82);border-color:transparent}

.cmp-btn{
  position:absolute;right:20px;bottom:20px;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(251,249,246,.92);
  border:1px solid rgba(230,223,212,.95);
  color:var(--ink-2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 4px 14px -8px rgba(44,38,33,.5);
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
}
.cmp-btn svg{width:16px;height:16px;display:block}
.cmp-btn:active{transform:scale(.94)}
.cmp-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* multi-photo strip */
.strip{
  position:absolute;left:18px;bottom:16px;
  display:flex;gap:6px;align-items:center;
  max-width:calc(100% - 90px);overflow-x:auto;
  padding:4px;background:rgba(251,249,246,.86);
  border:1px solid rgba(230,223,212,.9);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.strip button{
  flex:0 0 auto;width:30px;height:30px;overflow:hidden;
  border:1px solid transparent;line-height:0;
}
.strip button.on{border-color:var(--ink)}
.strip canvas{width:100%;height:100%;object-fit:cover;display:block}

/* ---------------- presets ---------------- */
.presets{
  flex:0 0 auto;
  display:flex;gap:9px;
  padding:9px 12px 8px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.presets::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;width:64px;
  display:flex;flex-direction:column;align-items:center;gap:0;
  text-align:center;
}
.chip-thumb{
  position:relative;width:50px;height:50px;
  border:1px solid var(--line);
  background:var(--paper-2);overflow:hidden;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
}
.chip-thumb canvas{width:100%;height:100%;display:block;object-fit:cover}
.chip-thumb .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:9px;letter-spacing:.16em;color:var(--faint);
}
.chip.on .chip-thumb{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chip:active .chip-thumb{transform:scale(.97)}
.chip-kr{font-size:9.5px;letter-spacing:-.02em;color:var(--muted);margin-top:5px;line-height:1.15;white-space:nowrap}
.chip-kr b{font-weight:400;font-family:var(--serif);font-size:9px;letter-spacing:.06em;color:var(--faint);margin-right:2px}
.chip.on .chip-kr{color:var(--ink)}
.chip.on .chip-kr b{color:var(--ink-2)}
.chip-del{
  position:absolute;top:0;right:0;width:15px;height:15px;
  display:grid;place-items:center;background:rgba(44,38,33,.78);color:#fff;
  font-size:9px;line-height:1;z-index:2;
}
.chip-del svg{width:8px;height:8px}

/* ---------------- panel ---------------- */
.panel{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  flex:0 0 auto;height:38px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line-soft);
}
.tabs{display:flex;gap:19px;height:100%;align-items:stretch}
.tab{
  position:relative;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-indent:.16em;
  color:var(--muted);display:flex;align-items:center;
  transition:color .18s var(--ease);
}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink)}
.head-actions{display:flex;align-items:center;gap:14px}
.mini-btn{
  font-size:9.5px;letter-spacing:.12em;color:var(--muted);
  display:flex;align-items:center;gap:4px;
  transition:color .18s var(--ease);
}
.mini-btn:active{color:var(--ink)}
.mini-btn svg{width:11px;height:11px;display:block}
#foldBtn{width:22px;height:22px;display:grid;place-items:center;margin-right:-4px}
#foldBtn svg{width:12px;height:12px;transition:transform .26s var(--ease)}
.app.folded #foldBtn svg{transform:rotate(180deg)}
.app.folded .panel-body{display:none}
.panel-body{
  flex:0 0 auto;height:272px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
@media (max-height:700px){ .panel-body{height:206px} }
.panel-veil{opacity:.34;pointer-events:none}

/* slider row */
.row{padding:5px 16px 4px}
.row + .row{border-top:1px solid rgba(239,233,223,.75)}
.panel-body.roomy .row{padding:20px 16px 18px}
.panel-body.roomy .row-head{margin-bottom:9px}
.panel-body.roomy .slider{height:24px}
.panel-body.roomy .row-name{font-size:11.5px}
.panel-body.roomy .row-val{font-size:10px}
.panel-body.roomy .slider input[type=range]{height:24px}
.panel-body.roomy .slider input[type=range]::-webkit-slider-runnable-track{height:24px}
.panel-body.roomy .slider input[type=range]::-webkit-slider-thumb{margin-top:6px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.row-name{font-size:10.5px;letter-spacing:.02em;color:var(--ink-2)}
.row-name em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:var(--faint);margin-left:6px;text-transform:uppercase}
.row-val{
  font-size:9.5px;color:var(--muted);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;min-width:26px;text-align:right;
}
.row.touched .row-val{color:var(--ink)}
.slider{position:relative;height:18px;display:flex;align-items:center}
.sl-track{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);transform:translateY(-50%)}
.sl-fill{position:absolute;top:50%;height:1px;background:var(--sand);transform:translateY(-50%)}
.sl-tick{position:absolute;left:50%;top:50%;width:1px;height:4px;background:var(--line);transform:translate(-50%,-50%)}
.slider input[type=range]{
  position:relative;z-index:2;width:100%;height:18px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;
}
.slider input[type=range]:focus{outline:none}
.slider input[type=range]::-webkit-slider-runnable-track{height:18px;background:transparent;border:0}
.slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--ink);border:0;
  box-shadow:0 0 0 3.5px var(--paper);
  margin-top:3px;
}
.slider input[type=range]::-moz-range-track{height:18px;background:transparent;border:0}
.slider input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:var(--ink);border:0;
  box-shadow:0 0 0 3.5px var(--paper);
}
.slider input[type=range]:disabled{opacity:.5}
.row-note{font-size:8.5px;color:var(--faint);letter-spacing:.02em;margin:-1px 0 6px}


/* ---------------- overlays ---------------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);
  background:rgba(44,38,33,.94);color:#FBF9F6;
  font-size:11px;letter-spacing:.02em;
  padding:9px 15px;border-radius:2px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);
  z-index:60;line-height:1.5;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.veil{
  position:absolute;inset:0;z-index:50;
  display:grid;place-items:center;
  background:rgba(251,249,246,.9);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.veil-inner{text-align:center}
.spin{width:19px;height:19px;margin:0 auto 12px;border:1px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.veil-text{font-size:10.5px;letter-spacing:.14em;color:var(--ink-2)}
.veil-sub{font-size:9px;letter-spacing:.06em;color:var(--muted);margin-top:6px}

.sheet{
  position:absolute;inset:0;z-index:55;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(44,38,33,.28);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.sheet-inner{
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:18px 18px calc(16px + env(safe-area-inset-bottom));
  animation:up .26s var(--ease);
}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.sheet-title{font-family:var(--serif);font-size:15px;letter-spacing:.04em;text-align:center;color:var(--ink);margin:0 0 3px}
.sheet-sub{font-size:10px;color:var(--muted);text-align:center;margin:0 0 14px;letter-spacing:.02em}
.sheet-preview{
  height:152px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;
  background:var(--wash);border:1px solid var(--line-soft);overflow:hidden;
}
.sheet-preview img{max-width:100%;max-height:148px;width:auto;height:auto;display:block}
.sheet-actions{display:flex;flex-direction:column;gap:8px}
.sheet-btn{
  height:44px;display:grid;place-items:center;
  border:1px solid var(--ink);font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--ink);
}
.sheet-btn.primary{background:var(--ink);color:var(--paper)}
.sheet-btn.ghost{border-color:var(--line);color:var(--muted);height:38px;font-weight:500;font-size:10.5px}
.sheet-btn:active{opacity:.82}

/* desktop framing */
@media (min-width:520px){
  body{background:#F2EEE7}
  .app{border-left:1px solid #E8E1D6;border-right:1px solid #E8E1D6}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <button class="icon-btn" id="pickBtn" aria-label="사진 선택" title="사진 선택">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="1.2"></rect>
        <circle cx="8.6" cy="9.6" r="1.6"></circle>
        <path d="M3.4 16.4l4.9-4.3 3.3 2.9 3.1-3.4 5.9 5.4"></path>
      </svg>
    </button>
    <div class="brand">
      <span class="brand-en">DANI WAY</span>
      <span class="brand-sub">FILTER</span>
    </div>
    <button class="save-btn" id="saveBtn" disabled>저장</button>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">

      <div class="empty" id="emptyState">
        <div class="empty-corners"><i></i><i></i><i></i><i></i></div>
        <div class="empty-mark">DANI WAY<span>FILTER</span></div>
        <div class="empty-rule"></div>
        <p class="empty-title">사진을 골라 주세요</p>
        <p class="empty-sub">아이폰 사진첩에서 바로 불러올 수 있어요</p>
        <button class="empty-btn" id="emptyPick">사진 불러오기</button>
        <p class="empty-hint">사진을 길게 누르면 원본과 비교돼요</p>
      </div>

      <div class="frames" id="frames" hidden>
        <canvas id="canvasBefore" aria-hidden="true"></canvas>
        <canvas id="canvasAfter" role="img" aria-label="보정된 사진 미리보기"></canvas>
        <div class="badge" id="badge">SUNLIT DAILY</div>
        <button class="cmp-btn" id="cmpBtn" aria-pressed="false" aria-label="원본과 비교">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.6" y="5.6" width="12" height="12.8" rx="1"></rect>
            <path d="M9.4 5.6V3.4h12v12.8h-2.2"></path>
          </svg>
        </button>
        <div class="strip" id="strip" hidden></div>
      </div>

      <div class="veil" id="veil" hidden>
        <div class="veil-inner">
          <div class="spin"></div>
          <div class="veil-text" id="veilText">원본 해상도로 만드는 중</div>
          <div class="veil-sub" id="veilSub">잠시만 기다려 주세요</div>
        </div>
      </div>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-inner">
          <p class="sheet-title">저장할 사진</p>
          <p class="sheet-sub">원본 해상도 · JPEG 95%</p>
          <div class="sheet-preview"><img id="sheetImg" alt="저장할 사진 미리보기"></div>
          <div class="sheet-actions">
            <button class="sheet-btn primary" id="sheetSave">사진첩에 저장</button>
            <button class="sheet-btn" id="sheetDownload">파일로 다운로드</button>

<script>
(function(){
'use strict';

/* ============================================================

   ============================================================ */

var $ = function(s){ return document.querySelector(s); };

var ADJ_KEYS = ['brightness','highlights','shadows','contrast','warmth','saturation','grain','glow','clarity'];

function zeros(){ var o={}; for(var i=0;i<ADJ_KEYS.length;i++) o[ADJ_KEYS[i]]=0; return o; }

/* ---------- preset looks (reference: presets.json) ---------- */
var LOOK = {

    hi:[0.048,0.026,-0.014], sh:[-0.008,0.004,0.020],
    saturation:0.92, vibrance:0.04,
    hueSat:[[200,60,-0.12]],
    glow:{thr:0.78, ratio:0.020, tint:[1.00,0.92,0.80]},
    halation:{thr:0.82, ratio:0.038, strength:0.14, tint:[1.00,0.55,0.38]},
    vignette:0.085
  }
};

var PRESETS = [
  { key:'original', no:'00', kr:'원본', en:'Original', look:null,
    base:{ brightness:0, highlights:0, shadows:0, contrast:0, warmth:0, saturation:0, grain:0, glow:0, clarity:0 } },
  { key:'sunlit', no:'01', kr:'일상·빛', en:'Sunlit Daily', look:LOOK.sunlit,
    base:{ brightness:0, highlights:-3, shadows:4, contrast:-2, warmth:2, saturation:1, grain:22, glow:38, clarity:-12 } },
  { key:'warm', no:'02', kr:'요리·카페', en:'Warm Table', look:LOOK.warm,
    base:{ brightness:2, highlights:-2, shadows:3, contrast:1, warmth:3, saturation:2, grain:18, glow:29, clarity:22 } },
  { key:'clean', no:'03', kr:'인테리어', en:'Clean Space', look:LOOK.clean,
    base:{ brightness:2, highlights:-4, shadows:1, contrast:2, warmth:-1, saturation:0, grain:9, glow:10, clarity:30 } },
  { key:'vintage', no:'04', kr:'여행·야외', en:'Vintage Classic', look:LOOK.vintage,
    base:{ brightness:0, highlights:-5, shadows:5, contrast:-2, warmth:3, saturation:-3, grain:55, glow:36, clarity:-15 } }
];

function presetOf(key){
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].key===key) return PRESETS[i];
  return PRESETS[0];
}

/* ---------- tone curve (Fritsch–Carlson monotone cubic) ---------- */
function buildLUT(points){
  var n = points.length, xs=[], ys=[], i, k;
  for (i=0;i<n;i++){ xs.push(points[i][0]); ys.push(points[i][1]); }
  var h=[], d=[], m=new Array(n);
  for (i=0;i<n-1;i++){ h[i]=xs[i+1]-xs[i]; d[i]=(ys[i+1]-ys[i])/h[i]; }
  m[0]=d[0]; m[n-1]=d[n-2];
  for (i=1;i<n-1;i++){
    if (d[i-1]*d[i] <= 0) { m[i]=0; }
    else {
      var w1 = 2*h[i] + h[i-1], w2 = h[i] + 2*h[i-1];
      m[i] = (w1+w2) / (w1/d[i-1] + w2/d[i]);
    }
  }
  for (i=0;i<n-1;i++){
    if (d[i]===0){ m[i]=0; m[i+1]=0; continue; }
    var a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b;
    if (s>9){ var t=3/Math.sqrt(s); m[i]=t*a*d[i]; m[i+1]=t*b*d[i]; }
  }
  var lut = new Float32Array(256);
  for (k=0;k<256;k++){
    var x = k/255, idx = 0;
    while (idx < n-2 && x > xs[idx+1]) idx++;
    var tt = (x-xs[idx])/h[idx], t2=tt*tt, t3=t2*tt;
    var y = (2*t3-3*t2+1)*ys[idx] + (t3-2*t2+tt)*h[idx]*m[idx]
          + (-2*t3+3*t2)*ys[idx+1] + (t3-t2)*h[idx]*m[idx+1];
    lut[k] = y<0?0:y>1?1:y;
  }
  return lut;
}

/* ---------- selective hue saturation table (2° bins) ---------- */
function buildHueGains(hueSat){
  if (!hueSat || !hueSat.length) return null;
  var tb = new Float32Array(180), b, i;
  for (b=0;b<180;b++){
    var hd = b*2, g = 1;
    for (i=0;i<hueSat.length;i++){
      var c = hueSat[i][0], w = hueSat[i][1], amt = hueSat[i][2];
      var dd = Math.abs(((hd - c + 540) % 360) - 180);
      var wt = 1 - dd/w;
      if (wt > 0) g *= (1 + amt * Math.pow(wt, 0.8));
    }
    tb[b] = g;
  }
  return tb;
}

/* ---------- seeded grain tile ---------- */
var GRAIN_TILE = (function(){
  var TS = 256, size = TS*TS, tile = new Float32Array(size);
  var seed = 20261124, s = seed >>> 0;
  for (var i=0;i<size;i++){
    s = (s + 0x6D2B79F5) | 0;
    var x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    var v = ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    tile[i] = v*2 - 1;
  }
  return tile;
})();
var GRAIN_SIZE = 256;

/* ---------- blur helper ---------- */
var CTX_FILTER = (function(){
  try {
    var c = document.createElement('canvas').getContext('2d');
    c.filter = 'blur(2px)';
    return c.filter === 'blur(2px)';
  } catch(e){ return false; }
})();

function blurCanvas(src, radius){
  var w = src.width, h = src.height;
  var out = document.createElement('canvas');
  out.width = w; out.height = h;
  var c = out.getContext('2d');
  var r = Math.max(1, radius);
  if (CTX_FILTER){
    c.filter = 'blur(' + r.toFixed(2) + 'px)';
    c.drawImage(src, 0, 0);
    c.filter = 'none';
    return out;
  }
  // fallback: box-ish blur via downscale/upscale
  var f = Math.max(2, Math.round(r * 0.9));
  var tw = Math.max(1, Math.round(w/f)), th = Math.max(1, Math.round(h/f));
  var tmp = document.createElement('canvas');
  tmp.width = tw; tmp.height = th;
  var t = tmp.getContext('2d');
  t.imageSmoothingEnabled = true; t.imageSmoothingQuality = 'high';
  t.drawImage(src, 0, 0, tw, th);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(tmp, 0, 0, w, h);
  return out;
}

/* ---------- bloom (glow / halation) ---------- */
function addBloom(canvas, ctx, o){
  var w = canvas.width, h = canvas.height, n = w*h;
  var src = ctx.getImageData(0,0,w,h).data;
  var mc = document.createElement('canvas'); mc.width = w; mc.height = h;
  var mctx = mc.getContext('2d');
  var md = mctx.createImageData(w,h), d = md.data;
  var thr = o.thr, inv = 1/(1-thr), i, p;
  for (i=0, p=0; i<n; i++, p+=4){
    var r = src[p]/255, g = src[p+1]/255, b = src[p+2]/255;
    var Y = 0.2126*r + 0.7152*g + 0.0722*b;
    var m;
    if (o.red){
      var a1 = (r-thr)*inv; a1 = a1<0?0:a1>1?1:a1;
      var a2 = (Y-thr)*inv; a2 = a2<0?0:a2>1?1:a2;
      m = a1*0.6 + a2*0.4;
    } else {
      var a = (Y-thr)*inv; a = a<0?0:a>1?1:a;
      m = Math.pow(a, 1.4);
    }
    var v = m*255;
    d[p] = v; d[p+1] = v; d[p+2] = v; d[p+3] = 255;
  }
  mctx.putImageData(md, 0, 0);
  var blurred = blurCanvas(mc, Math.max(1, Math.min(w,h) * o.ratio));
  var bctx = blurred.getContext('2d');
  bctx.globalCompositeOperation = 'multiply';
  bctx.fillStyle = 'rgb(' + Math.round(o.tint[0]*255) + ',' + Math.round(o.tint[1]*255) + ',' + Math.round(o.tint[2]*255) + ')';
  bctx.fillRect(0,0,w,h);
  bctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(1, o.strength);
  ctx.drawImage(blurred, 0, 0);
  ctx.restore();
}

/* ---------- main render ---------- */
function renderInto(canvas, src, presetKey, adj, maxSide, opts){
  opts = opts || {};
  var preset = presetOf(presetKey);
  var look = preset.look;
  var sw = src.width, sh = src.height, sx = 0, sy = 0, ssw = sw, ssh = sh, cw, ch;

  if (opts.square){
    var m = Math.min(sw, sh);
    ssw = ssh = m; sx = (sw-m)/2; sy = (sh-m)/2;
    cw = ch = Math.max(1, Math.min(maxSide, m));
  } else {
    var scale = Math.min(1, maxSide / Math.max(sw, sh));
    cw = Math.max(1, Math.round(sw*scale));
    ch = Math.max(1, Math.round(sh*scale));
  }

  canvas.width = cw; canvas.height = ch;
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0,0,cw,ch);
  ctx.drawImage(src, sx, sy, ssw, ssh, 0, 0, cw, ch);

  var L = look || {};
  var wb = L.wb || [1,1,1];
  var expo = (L.exposure || 1) * Math.pow(2, adj.brightness * 0.0125);
  var nz = L.neutralize || 0;
  var lut = L.curve ? buildLUT(L.curve) : null;
  var hueGain = buildHueGains(L.hueSat);
  var hiS = L.hi || [0,0,0], shS = L.sh || [0,0,0];
  var satL = (L.saturation == null ? 1 : L.saturation) * (1 + adj.saturation/100 * 0.85);
  var vibL = L.vibrance || 0;
  var warmR = 1 + adj.warmth * 0.0011;
  var warmG = 1 + adj.warmth * 0.0002;
  var warmB = 1 - adj.warmth * 0.0011;
  var cAdj = 1 + adj.contrast/100 * 0.55;
  var hlA = adj.highlights/100 * 0.22;
  var sdA = adj.shadows/100 * 0.20;

  var id = ctx.getImageData(0,0,cw,ch);
  var d = id.data, i, p, n = cw*ch;

  var gR = 1, gG = 1, gB = 1;
  if (nz){
    var mr=0, mg=0, mb=0;
    for (i=0,p=0;i<n;i++,p+=4){ mr+=d[p]; mg+=d[p+1]; mb+=d[p+2]; }
    mr = mr/n*wb[0]*expo*warmR;
    mg = mg/n*wb[1]*expo*warmG;
    mb = mb/n*wb[2]*expo*warmB;
    var t0 = (mr+mg+mb)/3;
    gR = 1 + nz*(t0/Math.max(mr,1e-4) - 1);
    gG = 1 + nz*(t0/Math.max(mg,1e-4) - 1);
    gB = 1 + nz*(t0/Math.max(mb,1e-4) - 1);
  }
  var kR = wb[0]*expo*gR*warmR;
  var kG = wb[1]*expo*gG*warmG;
  var kB = wb[2]*expo*gB*warmB;

  var needTone = !!lut || hiS[0]!==0 || hiS[1]!==0 || hiS[2]!==0 || shS[0]!==0 || shS[1]!==0 || shS[2]!==0;
  var needDetail = hlA !== 0 || sdA !== 0;
  var needContrast = cAdj !== 1;
  var needSat = satL !== 1 || vibL !== 0;

  for (i=0, p=0; i<n; i++, p+=4){
    var r = d[p]/255 * kR;
    var g = d[p+1]/255 * kG;
    var b = d[p+2]/255 * kB;
    var Y, mx, mn, dl;

    if (needTone){
      if (lut){
        var ri = (r*255 + 0.5)|0; if (ri<0) ri=0; else if (ri>255) ri=255;
        var gi = (g*255 + 0.5)|0; if (gi<0) gi=0; else if (gi>255) gi=255;
        var bi = (b*255 + 0.5)|0; if (bi<0) bi=0; else if (bi>255) bi=255;
        r = lut[ri]; g = lut[gi]; b = lut[bi];
      } else {
        if (r<0) r=0; else if (r>1) r=1;
        if (g<0) g=0; else if (g>1) g=1;
        if (b<0) b=0; else if (b>1) b=1;
      }
      Y = 0.2126*r + 0.7152*g + 0.0722*b;
      var hw = Y*Y, sw2 = (1-Y)*(1-Y);
      r += hw*hiS[0] + sw2*shS[0];
      g += hw*hiS[1] + sw2*shS[1];
      b += hw*hiS[2] + sw2*shS[2];
    }

    if (needDetail){
      Y = 0.2126*r + 0.7152*g + 0.0722*b;
      var hiM = Y*Y, shM = (1-Y)*(1-Y);
      var dv = sdA*shM + hlA*hiM;
      r += dv; g += dv; b += dv;
    }

    if (needContrast){
      r = 0.5 + (r-0.5)*cAdj;
      g = 0.5 + (g-0.5)*cAdj;
      b = 0.5 + (b-0.5)*cAdj;
    }

    if (hueGain){
      mx = r>g ? (r>b?r:b) : (g>b?g:b);
      mn = r<g ? (r<b?r:b) : (g<b?g:b);
      dl = mx-mn;
      if (dl > 1e-6 && mx > 1e-6){
        var hdeg;
        if (mx === r) hdeg = 60 * (((g-b)/dl) % 6);
        else if (mx === g) hdeg = 60 * ((b-r)/dl + 2);
        else hdeg = 60 * ((r-g)/dl + 4);
        if (hdeg < 0) hdeg += 360;
        var gain = hueGain[((hdeg*0.5)|0) % 180];
        var s = dl/mx * gain;
        if (s > 1) s = 1; else if (s < 0) s = 0;
        var vv = mx;
        var h6 = hdeg/60, ii = Math.floor(h6), ff = h6-ii;
        if (ii > 5) ii = 5; if (ii < 0) ii = 0;
        var pp = vv*(1-s), qq = vv*(1-ff*s), tt2 = vv*(1-(1-ff)*s);
        if (ii === 0){ r=vv; g=tt2; b=pp; }
        else if (ii === 1){ r=qq; g=vv; b=pp; }
        else if (ii === 2){ r=pp; g=vv; b=tt2; }
        else if (ii === 3){ r=pp; g=qq; b=vv; }
        else if (ii === 4){ r=tt2; g=pp; b=vv; }
        else { r=vv; g=pp; b=qq; }
      }
    }

    if (needSat){
      Y = 0.2126*r + 0.7152*g + 0.0722*b;
      if (satL !== 1){
        r = Y + (r-Y)*satL; g = Y + (g-Y)*satL; b = Y + (b-Y)*satL;
      }
      if (vibL){
        mx = r>g ? (r>b?r:b) : (g>b?g:b);
        mn = r<g ? (r<b?r:b) : (g<b?g:b);
        var sNow = mx > 1e-5 ? (mx-mn)/mx : 0;
        var boost = 1 + vibL*(1-sNow);
        Y = 0.2126*r + 0.7152*g + 0.0722*b;
        r = Y + (r-Y)*boost; g = Y + (g-Y)*boost; b = Y + (b-Y)*boost;
      }
    }

    d[p]   = r <= 0 ? 0 : r >= 1 ? 255 : (r*255 + 0.5)|0;
    d[p+1] = g <= 0 ? 0 : g >= 1 ? 255 : (g*255 + 0.5)|0;
    d[p+2] = b <= 0 ? 0 : b >= 1 ? 255 : (b*255 + 0.5)|0;
  }
  ctx.putImageData(id, 0, 0);

  var shortSide = Math.min(cw, ch);

  /* clarity (positive) / soft focus (negative) */
  var clarity = Math.max(0, adj.clarity)/100;
  var soft = Math.max(0, -adj.clarity)/100 * 0.42;
  if (clarity > 0.002 || soft > 0.002){
    var rad = Math.max(1, shortSide * (clarity > 0 ? 0.008 : 0.004));
    var bl = blurCanvas(canvas, rad);
    var bd = bl.getContext('2d', { willReadFrequently: true }).getImageData(0,0,cw,ch).data;
    var cur = ctx.getImageData(0,0,cw,ch), cd = cur.data;
    for (i=0,p=0;i<n;i++,p+=4){
      for (var c2=0;c2<3;c2++){
        var j = p+c2;
        var v = cd[j], bv = bd[j];
        if (clarity > 0) v = v + (v-bv)*clarity;
        if (soft > 0) v = v*(1-soft) + bv*soft;
        cd[j] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
    ctx.putImageData(cur, 0, 0);
  }

  /* glow + halation */
  var glowAmt = adj.glow/100 * 0.42;
  var baseGlow = preset.base.glow || 0;
  if (glowAmt > 0.002 && L.glow){
    addBloom(canvas, ctx, { thr:L.glow.thr, ratio:L.glow.ratio, tint:L.glow.tint, strength:glowAmt, red:false });
  }
  if (L.halation && baseGlow > 0 && glowAmt > 0.002){
    var hStr = L.halation.strength * (glowAmt / (baseGlow/100*0.42));
    if (hStr > 0.002){
      addBloom(canvas, ctx, { thr:L.halation.thr, ratio:L.halation.ratio, tint:L.halation.tint, strength:Math.min(0.5,hStr), red:true });
    }
  }

  /* vignette */
  if (L.vignette){
    var cx = cw/2, cy = ch/2, R = Math.sqrt(cx*cx + cy*cy);
    var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    for (var k=0;k<=12;k++){
      var tk = k/12;
      grd.addColorStop(tk, 'rgba(0,0,0,' + (L.vignette * Math.pow(tk, 2.2)).toFixed(4) + ')');
    }
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,cw,ch);
    ctx.restore();
  }

  /* film grain */
  var gAmt = adj.grain/100 * 0.030 * 0.9;
  if (gAmt > 0.00015 && !opts.fast){
    var gs = opts.grainScale || 1;
    var gi2 = ctx.getImageData(0,0,cw,ch), gd = gi2.data;
    var tile = GRAIN_TILE, TS = GRAIN_SIZE;
    for (var y=0;y<ch;y++){
      var fy = y/gs, y0 = Math.floor(fy), ty = fy - y0;
      y0 = ((y0 % TS) + TS) % TS;
      var y1 = (y0+1) % TS;
      var row0 = y0*TS, row1 = y1*TS;
      var pr = y*cw*4;
      for (var x=0;x<cw;x++){
        var fx = x/gs, x0 = Math.floor(fx), tx = fx - x0;
        x0 = ((x0 % TS) + TS) % TS;
        var x1 = (x0+1) % TS;
        var n0 = tile[row0+x0]*(1-tx) + tile[row0+x1]*tx;
        var n1 = tile[row1+x0]*(1-tx) + tile[row1+x1]*tx;
        var nv = n0*(1-ty) + n1*ty;
        var q = pr + x*4;
        var Yg = (0.2126*gd[q] + 0.7152*gd[q+1] + 0.0722*gd[q+2]) / 255;
        var amt = nv * gAmt * 255 * (1 - 0.45*Yg);
        gd[q] += amt; gd[q+1] += amt; gd[q+2] += amt;
      }
    }
    ctx.putImageData(gi2, 0, 0);
  }
}

var PREVIEW_MAX = 1200;
var DRAG_MAX = 520;
var SAVE_MAX = 4032;

/* ============================================================
   rendering schedule
   ============================================================ */
var renderBusy = false;
var renderQueued = null;

function currentImage(){ return state.images[state.index] || null; }

function fitFrames(){
  var w = el.after.width, h = el.after.height;
  if (!w || !h) return;
  var bw = el.frames.clientWidth, bh = el.frames.clientHeight;
  if (!bw || !bh) return;
  var pad = bw < 420 ? 18 : 26;
  var availW = Math.max(40, bw - pad*2), availH = Math.max(40, bh - pad*2);
  var s = Math.min(availW/w, availH/h);
  var cw = Math.round(w*s), ch = Math.round(h*s);
  el.after.style.width = cw + 'px';
  el.after.style.height = ch + 'px';
  el.before.style.width = cw + 'px';
  el.before.style.height = ch + 'px';

  var fr = el.frames.getBoundingClientRect();
  var cr = el.after.getBoundingClientRect();
  var bx = Math.max(6, Math.round(cr.left - fr.left) + 10);
  var by = Math.max(6, Math.round(cr.top - fr.top) + 10);
  el.badge.style.left = bx + 'px';
  el.badge.style.top = by + 'px';
}

function paint(full){
  var img = currentImage();
  if (!img) return;
  var max = full ? PREVIEW_MAX : DRAG_MAX;
  renderInto(el.after, img.bitmap || img.el, state.preset, state.adj, max, { fast: !full });
  el.before.width = el.after.width;
  el.before.height = el.after.height;
  var bctx = el.before.getContext('2d');
  bctx.imageSmoothingEnabled = true;
  bctx.imageSmoothingQuality = 'high';
  bctx.clearRect(0,0,el.before.width,el.before.height);
  bctx.drawImage(img.bitmap || img.el, 0, 0, el.before.width, el.before.height);
  fitFrames();
}

function requestPaint(quality){
  if (renderBusy){ renderQueued = (renderQueued === 'full' || quality === 'full') ? 'full' : 'fast'; return; }
  renderBusy = true;
  var q = quality;
  requestAnimationFrame(function(){
    try { paint(q === 'full'); }
    catch(err){ console.error(err); }
    renderBusy = false;
    if (renderQueued){
      var next = renderQueued; renderQueued = null;
      requestPaint(next);
    }
  });
}

function buildChips(){
  el.presetRow.innerHTML = '';
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'chip';
    b.dataset.key = p.key;
    b.type = 'button';
    b.setAttribute('aria-label', p.kr + ' 프리셋');
    b.innerHTML = '<span class="chip-thumb"><span class="ph">' + p.no + '</span></span>' +
                  '<span class="chip-kr"><b>' + p.no + '</b>' + p.kr + '</span>';
    b.addEventListener('click', function(){ applyPreset(p.key); });
    el.presetRow.appendChild(b);
  });
  state.saved.forEach(function(s, idx){
    var b = document.createElement('button');
    b.className = 'chip saved';
    b.type = 'button';
    b.setAttribute('aria-label', s.name + ' 저장한 조합');
    b.innerHTML = '<span class="chip-thumb"><span class="ph">MY</span></span>' +
                  '<span class="chip-kr"><b>MY' + (idx+1) + '</b>' + s.name + '</span>' +
                  '<span class="chip-del" data-del="' + s.id + '" aria-label="삭제">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg></span>';
    b.addEventListener('click', function(ev){
      var del = ev.target.closest('[data-del]');
      if (del){ ev.stopPropagation(); deleteCombo(del.getAttribute('data-del')); return; }
      applySaved(s);
    });
    el.presetRow.appendChild(b);
  });
  syncChips();
}

function syncChips(){
  var chips = el.presetRow.querySelectorAll('.chip');
  chips.forEach(function(c){
    var on = c.dataset.key === state.preset;
    c.classList.toggle('on', on);
  });
  updateBadge();
}

function updateBadge(){
  var p = presetOf(state.preset);
  el.badge.textContent = state.comparingNow() ? 'BEFORE' : (p.no === '00' ? 'ORIGINAL' : p.no + ' · ' + p.en.toUpperCase());
}

/* thumbnails for chips (photo-aware) */
var thumbQueue = [];
function renderChipThumbs(){
  var img = currentImage();
  var canvases = el.presetRow.querySelectorAll('.chip-thumb');
  var presetList = PRESETS.concat(state.saved.map(function(s){
    return { key: s.preset, adj: s.adj };
  }));
  var i = 0;
  function step(){
    var c = canvases[i];
    if (!c || i >= presetList.length) return;
    var item = presetList[i];
    try {
      if (img){
        var cv = document.createElement('canvas');
        renderInto(cv, img.bitmap || img.el, item.key, item.adj || presetOf(item.key).base, 108, { square:true, grainScale: 1 });
        var old = c.querySelector('canvas');
        if (old) old.remove();
        var ph = c.querySelector('.ph');
        if (ph) ph.remove();
        cv.style.width = '100%'; cv.style.height = '100%';
        c.insertBefore(cv, c.firstChild);
      } else {
        var oc = c.querySelector('canvas');
        if (oc) oc.remove();
        if (!c.querySelector('.ph')){
          var sp = document.createElement('span');
          sp.className = 'ph';
          sp.textContent = item.no || 'MY';
          c.appendChild(sp);
        }
      }
    } catch(e){ console.warn('thumb', e); }
    i++;
    if (i < canvases.length) setTimeout(step, 0);
  }
  setTimeout(step, 0);
}

/* ============================================================

   ============================================================ */
var SLIDERS = {
  adjust: [
    { k:'brightness', kr:'밝기', en:'Exposure', min:-100, max:100 },
    { k:'highlights', kr:'하이라이트', en:'Highlights', min:-100, max:100 },
    { k:'shadows', kr:'그림자', en:'Shadows', min:-100, max:100 },
    { k:'contrast', kr:'대비', en:'Contrast', min:-100, max:100 },
    { k:'warmth', kr:'색온도', en:'Warmth', min:-100, max:100 },
    { k:'saturation', kr:'채도', en:'Saturation', min:-100, max:100 }
  ],
  texture: [
    { k:'grain', kr:'필름 그레인', en:'Grain', min:0, max:100 },
    { k:'glow', kr:'빛 번짐', en:'Glow', min:0, max:100 },
    { k:'clarity', kr:'선명도 · 부드러움', en:'Clarity', min:-100, max:100 }
  ]
};

var sliderRefs = {};

function buildPanel(){
  el.panelBody.innerHTML = '';
  el.panelBody.classList.toggle('roomy', state.tab === 'texture');
  sliderRefs = {};
  var list = SLIDERS[state.tab];
  list.forEach(function(def){
    var row = document.createElement('div');
    row.className = 'row';
    var bip = def.min < 0;
    row.innerHTML =
      '<div class="row-head">' +
        '<span class="row-name">' + def.kr + '<em>' + def.en + '</em></span>' +
        '<span class="row-val" data-val="' + def.k + '">0</span>' +
      '</div>' +
      '<div class="slider">' +
        '<div class="sl-track"></div>' +
        '<div class="sl-fill" data-fill="' + def.k + '"></div>' +
        (bip ? '<div class="sl-tick"></div>' : '') +
        '<input type="range" min="' + def.min + '" max="' + def.max + '" step="1" value="0" data-slider="' + def.k + '" aria-label="' + def.kr + '">' +
      '</div>';
    el.panelBody.appendChild(row);

    var input = row.querySelector('input');
    sliderRefs[def.k] = {
      row: row,
      input: input,
      val: row.querySelector('[data-val]'),
      fill: row.querySelector('[data-fill]'),
      bip: bip,
      min: def.min,
      max: def.max
    };
    input.addEventListener('input', function(){
      state.adj[def.k] = Number(input.value);
      syncSlider(def.k);
      requestPaint('fast');
    });
    input.addEventListener('change', function(){
      state.adj[def.k] = Number(input.value);
      syncSlider(def.k);
      requestPaint('full');
      saveLast();
    });
    input.addEventListener('pointerdown', function(){ input.dataset.dragging = '1'; });
    input.addEventListener('pointerup', function(){ if (input.dataset.dragging){ delete input.dataset.dragging; requestPaint('full'); } });
  });
  syncAllSliders();
  setPanelEnabled(!!currentImage());
}

function setPanelEnabled(on){
  el.panelBody.classList.toggle('panel-veil', !on);
  el.resetBtn.disabled = !on;
  el.saveComboBtn.disabled = !on;
  var inputs = el.panelBody.querySelectorAll('input');
  inputs.forEach(function(i){ i.disabled = !on; });
}

function fmtVal(k, v){
  var def = null, all = SLIDERS.adjust.concat(SLIDERS.texture);
  for (var i=0;i<all.length;i++) if (all[i].k === k) def = all[i];
  if (!def) return String(v);
  if (def.min < 0) return v > 0 ? '+' + v : (v < 0 ? '−' + Math.abs(v) : '0');
  return String(v);
}

function syncSlider(k){
  var ref = sliderRefs[k];
  if (!ref) return;
  var v = state.adj[k];
  ref.input.value = v;
  ref.val.textContent = fmtVal(k, v);
  var pct = (v - ref.min) / (ref.max - ref.min) * 100;
  if (ref.bip){
    var mid = 50;
    ref.fill.style.left = Math.min(pct, mid) + '%';
    ref.fill.style.width = Math.abs(pct - mid) + '%';
  } else {
    ref.fill.style.left = '0%';
    ref.fill.style.width = pct + '%';
  }
  var base = presetOf(state.preset).base[k] || 0;
  ref.row.classList.toggle('touched', v !== base);
}

function syncAllSliders(){
  for (var k in sliderRefs) if (sliderRefs.hasOwnProperty(k)) syncSlider(k);
}

   actions

function applyPreset(key){
  state.preset = key;
  state.adj = Object.assign({}, presetOf(key).base);
  syncChips();
  syncAllSliders();
  requestPaint('full');
  saveLast();
}

function applySaved(s){
  state.preset = s.preset;
  state.adj = Object.assign({}, presetOf(s.preset).base, s.adj);
  syncChips();
  syncAllSliders();
  requestPaint('full');
  saveLast();
  toast(s.name + ' 조합을 적용했어요');
}

function resetAdjust(){
  state.adj = Object.assign({}, presetOf(state.preset).base);

  requestPaint('full');

  toast('프리셋 기본값으로 되돌렸어요');
}

function saveCombo(){
  var n = state.saved.length + 1;
  var s = {
    id: 'c' + Date.now(),
    name: '내 조합 ' + n,
    preset: state.preset,
    adj: Object.assign({}, state.adj)
  };
  state.saved.push(s);

  buildChips();
  renderChipThumbs();
  el.presetRow.scrollLeft = el.presetRow.scrollWidth;
  toast('조합을 저장했어요 · 오른쪽 위 × 로 지울 수 있어요');
}

function deleteCombo(id){
  state.saved = state.saved.filter(function(s){ return s.id !== id; });
  writeSaved();
  buildChips();
  renderChipThumbs();
  toast('저장한 조합을 지웠어요');
}

function writeSaved(){
  try { localStorage.setItem(LS_SAVED, JSON.stringify(state.saved)); } catch(e){}
}
function readSaved(){
  try {
    var raw = localStorage.getItem(LS_SAVED);
    if (raw){
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) state.saved = arr.filter(function(s){ return s && s.id && s.adj; });
    }
  } catch(e){}
}
function saveLast(){
  try {
    localStorage.setItem(LS_LAST, JSON.stringify({ preset: state.preset, adj: state.adj }));
  } catch(e){}
}
function readLast(){
  try {
    var raw = localStorage.getItem(LS_LAST);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && o.preset && presetOf(o.preset).key === o.preset){
      state.preset = o.preset;
      state.adj = Object.assign({}, presetOf(o.preset).base, o.adj || {});
    }
  } catch(e){}
}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg, ms){
  el.toast.textContent = msg;
  el.toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.toast.classList.remove('on'); }, ms || 2400);
}

/* ---------- file loading ---------- */
function loadImageFile(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){ resolve({ el: img, url: url }); };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

function handleFiles(files){
  var list = Array.prototype.filter.call(files, function(f){ return /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name); });
  if (!list.length){ toast('사진 파일을 골라 주세요'); return; }
  list = list.slice(0, 12);
  el.veilText.textContent = '사진을 불러오는 중';
  el.veilSub.textContent = '';
  el.veil.hidden = false;

  var jobs = list.map(function(f){
    return (window.createImageBitmap ? createImageBitmap(f, { imageOrientation:'from-image' }) : Promise.reject())
      .then(function(bmp){ return { bitmap: bmp }; })
      .catch(function(){ return loadImageFile(f); });
  });

  Promise.all(jobs).then(function(imgs){
    state.images.forEach(function(im){ if (im.url) URL.revokeObjectURL(im.url); });
    state.images = imgs;
    state.index = 0;
    el.veil.hidden = true;
    showPhoto();
    if (imgs.length > 1) toast(imgs.length + '장을 불러왔어요 · 아래 썸네일로 바꿀 수 있어요', 3200);
  }).catch(function(err){
    console.error(err);
    el.veil.hidden = true;
    toast('사진을 불러오지 못했어요. 다른 사진으로 해보시겠어요?', 3200);
  });
}

function showPhoto(){
  var img = currentImage();
  if (!img) return;
  el.emptyState.hidden = true;
  el.frames.hidden = false;
  el.saveBtn.disabled = false;
  setPanelEnabled(true);
  el.frames.classList.remove('cmp');
  state.compareLocked = false;
  el.cmpBtn.classList.remove('on');
  el.cmpBtn.setAttribute('aria-pressed', 'false');
  buildStrip();
  paint(true);
  renderChipThumbs();
  updateBadge();
}

function buildStrip(){
  el.strip.innerHTML = '';
  if (state.images.length < 2){ el.strip.hidden = true; return; }
  el.strip.hidden = false;
  state.images.forEach(function(im, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = i === state.index ? 'on' : '';
    b.setAttribute('aria-label', (i+1) + '번째 사진');
    var c = document.createElement('canvas');
    c.width = 60; c.height = 60;
    var cx = c.getContext('2d');
    var src = im.bitmap || im.el;
    var m = Math.min(src.width, src.height);
    cx.drawImage(src, (src.width-m)/2, (src.height-m)/2, m, m, 0, 0, 60, 60);
    b.appendChild(c);
    b.addEventListener('click', function(){
      state.index = i;
      buildStrip();
      paint(true);
      renderChipThumbs();
      updateBadge();
    });
    el.strip.appendChild(b);
  });
}

/* ---------- compare ---------- */
state.comparingNow = function(){
  return state.compareLocked || state.pressing;
};

function setCompare(v){
  el.frames.classList.toggle('cmp', v);
  updateBadge();
}

el.frames.addEventListener('pointerdown', function(ev){
  if (!currentImage()) return;
  if (ev.target.closest('.cmp-btn') || ev.target.closest('.strip')) return;
  state.pressing = true;
  setCompare(true);
});
window.addEventListener('pointerup', function(){
  if (!state.pressing) return;
  state.pressing = false;
  setCompare(state.compareLocked);
});
window.addEventListener('pointercancel', function(){
  if (!state.pressing) return;
  state.pressing = false;
  setCompare(state.compareLocked);
});
el.frames.addEventListener('contextmenu', function(e){ e.preventDefault(); });

el.cmpBtn.addEventListener('click', function(){
  state.compareLocked = !state.compareLocked;
  el.cmpBtn.classList.toggle('on', state.compareLocked);
  el.cmpBtn.setAttribute('aria-pressed', state.compareLocked ? 'true' : 'false');
  setCompare(state.compareLocked);
});

/* ---------- saving ---------- */
function toBlob(canvas){
  return new Promise(function(resolve){
    if (canvas.toBlob){
      canvas.toBlob(function(b){ resolve(b); }, 'image/jpeg', 0.95);
    } else {
      var url = canvas.toDataURL('image/jpeg', 0.95);
      var bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
      for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      resolve(new Blob([arr], { type:'image/jpeg' }));
    }
  });
}

var lastBlob = null, lastName = '', lastUrl = null;

function stampName(){
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return 'DANIWAY_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.jpg';
}

function doSave(){
  var img = currentImage();
  if (!img) return;
  el.saveBtn.disabled = true;
  el.veilText.textContent = '원본 해상도로 만드는 중';
  el.veilSub.textContent = '사진 크기에 따라 몇 초 걸릴 수 있어요';
  el.veil.hidden = false;

  setTimeout(function(){
    try {
      var full = document.createElement('canvas');
      var src = img.bitmap || img.el;
      var longSide = Math.max(src.width, src.height);
      var gs = Math.max(1, Math.min(SAVE_MAX, longSide) / PREVIEW_MAX);
      renderInto(full, src, state.preset, state.adj, SAVE_MAX, { grainScale: gs });
      toBlob(full).then(function(blob){
        el.veil.hidden = true;
        el.saveBtn.disabled = false;
        if (!blob){ toast('저장에 실패했어요'); return; }
        lastBlob = blob;
        lastName = stampName();
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        shareOrSheet(full.width, full.height);
      });
    } catch(err){
      console.error(err);
      el.veil.hidden = true;
      el.saveBtn.disabled = false;
      toast('저장 중 문제가 생겼어요. 사진을 다시 불러와 볼까요?', 3200);
    }
  }, 60);
}

var lastDims = { w:0, h:0 };

function shareOrSheet(w, h){
  lastDims.w = w; lastDims.h = h;
  var file;
  try {
    file = new File([lastBlob], lastName, { type:'image/jpeg' });
  } catch(e){ file = null; }

  if (file && navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'DANI WAY FILTER' }).then(function(){
      toast('사진첩에 저장하거나 공유할 수 있어요');
    }).catch(function(err){
      if (err && err.name === 'AbortError') return;
      openSheet();
    });
  } else {
    openSheet();
  }
}

function openSheet(){
  el.sheetImg.src = lastUrl;
  el.sheet.hidden = false;
}

function downloadFile(){
  if (!lastBlob) return;
  var a = document.createElement('a');
  a.href = lastUrl;
  a.download = lastName;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); }, 0);
  toast('다운로드 폴더로 저장했어요');
}

function switchTab(t){
  document.getElementById('app').classList.remove('folded');
  el.foldBtn.setAttribute('aria-expanded', 'true');
  if (state.tab === t) { requestAnimationFrame(function(){ fitFrames(); }); return; }
  state.tab = t;
  var on = t === 'adjust';
  el.tabAdjust.classList.toggle('on', on);
  el.tabAdjust.setAttribute('aria-selected', on ? 'true' : 'false');
  el.tabTexture.classList.toggle('on', !on);
  el.tabTexture.setAttribute('aria-selected', !on ? 'true' : 'false');
  buildPanel();
}

el.sheetSave.addEventListener('click', function(){
  if (!lastBlob) return;
  var file = new File([lastBlob], lastName, { type:'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'DANI WAY FILTER' }).catch(function(){});
  } else {
    var opened = window.open(lastUrl, '_blank');
    if (!opened) downloadFile();
  }
});
el.sheetDownload.addEventListener('click', downloadFile);
el.sheetClose.addEventListener('click', function(){ el.sheet.hidden = true; });
el.sheet.addEventListener('click', function(e){ if (e.target === el.sheet) el.sheet.hidden = true; });

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ el.sheet.hidden = true; }
});

/* keep the photo fitted to the stage whenever the stage changes size */
try {
  var ro = new ResizeObserver(function(){ fitFrames(); });
  ro.observe(el.frames);
  ro.observe(el.stage);
} catch(e){}

/* window resize → re-render preview at current quality */
var rzTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(rzTimer);
  rzTimer = setTimeout(function(){ if (currentImage()) requestPaint('full'); else fitFrames(); }, 220);
});

/* boot */
readSaved();
readLast();
buildChips();
buildPanel();
setPanelEnabled(false);
updateBadge();

})();
</script>
</body>
</html>
